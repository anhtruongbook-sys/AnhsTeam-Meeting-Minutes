name: Build Anh's TEAM Meeting Minutes (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/AnhsTeam_MeetingMinutes.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/AnhsTeam_MeetingMinutes.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnhsTeam_MeetingMinutes-mobile-release-apk
          path: build-output/AnhsTeam_MeetingMinutes.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.5.0
          name: "Anh's TEAM - Phân Biệt Giọng Nói (Speaker Diarization) & Tự Phát Hiện Độc Thoại 01 Người vs Biên Bản Họp v1.5.0 (Android APK)"
          body: |
            ## Ứng Dụng Ghi Âm Phòng Họp, Phân Biệt Giọng Nói (Voice Biometrics) & Tự Sinh Tài Liệu (.DOCX) - Anh's TEAM (v1.5.0)
            - **Phân tích Sinh trắc học Giọng nói DSP (`VoiceSignature` & `Speaker Diarization`)**:
              + Đo tần số cơ bản thanh quản ($F_0$ Hz qua hàm tự tương quan chuẩn hóa Normalized Autocorrelation trong dải `[75Hz - 340Hz]`), độ sáng phổ âm sắc (Spectral Brightness) và Zero-Crossing Rate (ZCR) trên từng phân đoạn tiếng nói.
              + Tự động phân cụm và gắn nhãn các giọng nói khác nhau (`Người nói #1 (Giọng Nam trầm ~115Hz)`, `Người nói #2 (Giọng Nữ/Cao ~210Hz)`...) khi có từ 2 người trở lên tham gia cuộc họp.
            - **Tự động nhận diện Nội dung Độc thoại (01 người nói) vs Biên bản Cuộc họp (Nhiều người nói)**:
              + **`MONOLOGUE` (Chỉ 01 người nói)**: Khi phát hiện toàn bộ file ghi âm chỉ có 01 người nói (và không có cấu trúc chủ trì/thư ký cuộc họp), hệ thống tự động chuyển sang mẫu **"BẢN GỠ BĂNG & TÓM TẮT NỘI DUNG GHI ÂM (01 NGƯỜI NÓI - KHÔNG PHẢI BIÊN BẢN HỌP)"**, tuyệt đối không gán ép Chủ trì, Thư ký hay Bảng phân công nhiệm vụ giả định.
              + **`MEETING` ($\ge 2$ giọng nói khác nhau)**: Xuất đầy đủ **BIÊN BẢN CUỘC HỌP** chuẩn Nghị định 30/2020/NĐ-CP kèm báo cáo phân cụm giọng nói và ghi nhận ý kiến theo từng người phát biểu.
          files: build-output/AnhsTeam_MeetingMinutes.apk
          draft: false
          prerelease: false
