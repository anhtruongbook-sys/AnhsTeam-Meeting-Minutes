name: Build Anh's TEAM Meeting Minutes (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/AnhsTeam_MeetingMinutes.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/AnhsTeam_MeetingMinutes.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnhsTeam_MeetingMinutes-mobile-release-apk
          path: build-output/AnhsTeam_MeetingMinutes.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.6.0
          name: "Anh's TEAM - Phân Biệt Giọng Nói & Xuất Bản Gỡ Băng Nguyên Văn 100% (Không Tóm Tắt) v1.6.0 (Android APK)"
          body: |
            ## Ứng Dụng Ghi Âm Phòng Họp, Phân Biệt Giọng Nói (Voice Biometrics) & Xuất Gỡ Băng Nguyên Văn 100% (.DOCX) - Anh's TEAM (v1.6.0)
            - **Chế độ 01 người nói (`MONOLOGUE`) — BẢN GỠ BĂNG NGUYÊN VĂN NỘI DUNG GHI ÂM (100% VERBATIM - KHÔNG TÓM TẮT)**:
              + Khi phát hiện toàn bộ file ghi âm chỉ có 01 người nói, hệ thống xuất **100% nội dung nguyên văn từ đầu đến cuối** (gồm cả **Mục II: Văn bản nguyên văn liền mạch** nối liền toàn bộ các câu chữ để đọc/copy thuận tiện và **Mục III: Chi tiết nguyên văn theo từng mốc thời gian**).
              + **Tuyệt đối không tóm tắt**, không cắt bớt nội dung và không gán ép Chủ trì / Thư ký / Bảng phân công nhiệm vụ giả định.
            - **Chế độ nhiều người nói (`MEETING`) — BIÊN BẢN CUỘC HỌP ($\ge 2$ giọng nói khác nhau)**:
              + Đo tần số thanh quản ($F_0$ Hz) và âm sắc để phân biệt `Người nói #1`, `Người nói #2`, `Người nói #3`... và xuất Biên bản cuộc họp đầy đủ theo Nghị định 30/2020/NĐ-CP.
          files: build-output/AnhsTeam_MeetingMinutes.apk
          draft: false
          prerelease: false
