name: Build Anh's TEAM Meeting Minutes (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/AnhsTeam_MeetingMinutes.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/AnhsTeam_MeetingMinutes.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnhsTeam_MeetingMinutes-mobile-release-apk
          path: build-output/AnhsTeam_MeetingMinutes.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Anh's TEAM - Ghi Biên Bản Cuộc Họp v1.0.0 (Android APK)"
          body: |
            ## Ứng Dụng Ghi Âm Phòng Họp & Xuất Biên Bản Cuộc Họp (.DOCX) - Anh's TEAM
            - **Logo & Nhận diện**: Anh's TEAM (Enthusiasm and Ambition).
            - **Thu âm phòng họp DSP**: Thu âm `16kHz 16-bit PCM WAV` kèm bộ khuếch đại khoảng cách xa (`Far-Field Room Gain Boost x1.0 - x6.0`) và kiểm định toàn vẹn `SHA-256`.
            - **Gỡ băng & Đánh dấu lượt lời**: Nhận diện giọng nói tiếng Việt (`vi-VN` SpeechRecognizer) và gán nhãn người phát biểu kèm dấu thời gian `[HH:MM:SS]`.
            - **Xuất Biên bản cuộc họp Word (`.docx`) chuẩn Nghị định 30/2020/NĐ-CP**: Khổ A4, lề chuẩn, Quốc hiệu & Tiêu ngữ 2 cột ẩn viền, phông chữ `Times New Roman` màu đen `#000000`, bảng phân công nhiệm vụ nền trắng viền đen `0.5pt`.
          files: build-output/AnhsTeam_MeetingMinutes.apk
          draft: false
          prerelease: false
