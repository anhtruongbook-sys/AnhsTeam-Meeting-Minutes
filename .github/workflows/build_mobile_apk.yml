name: Build Anh's TEAM Meeting Minutes (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/AnhsTeam_MeetingMinutes.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/AnhsTeam_MeetingMinutes.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnhsTeam_MeetingMinutes-mobile-release-apk
          path: build-output/AnhsTeam_MeetingMinutes.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "Anh's TEAM - Ghi Biên Bản Cuộc Họp Đa Ngữ & Nhập File Có Sẵn v1.2.0 (Android APK)"
          body: |
            ## Ứng Dụng Ghi Âm Phòng Họp, Nhập File Có Sẵn & Xuất Biên Bản Cuộc Họp Đa Ngôn Ngữ (Việt - Anh - Đức) - Anh's TEAM
            - **Logo & Nhận diện**: Anh's TEAM (Enthusiasm and Ambition).
            - **Nhập File Có Sẵn Trong Máy (`ExistingFileImporter`)**:
              + Hỗ trợ chọn trực tiếp tệp âm thanh có sẵn (`.wav`, `.m4a`, `.mp3`, `.aac`, `.ogg`, `.flac`, `.amr`, `.3gp`) hoặc tự động quét thư mục `/Recordings`, `/Voice Recorder`, `/Call`, `/Download` trên máy để phát, tua nhanh `-10s/+10s`, lấy mốc thời gian thực và gỡ băng lập biên bản.
              + Hỗ trợ nhập tệp văn bản / phụ đề / gỡ băng có sẵn (`.txt`, `.srt`, `.vtt`, `.json`, `.docx`, `.md`), tự động bóc tách lượt phát biểu, tự nhận diện ngôn ngữ (`VI` / `EN` / `DE`), kết luận và bảng phân công nhiệm vụ.
            - **Gỡ băng & Nhận diện Giọng nói 3 Ngôn ngữ (`vi-VN`, `en-US`, `de-DE`)**.
            - **Xuất Biên bản cuộc họp Word (`.docx`) chuẩn Nghị định 30/2020/NĐ-CP & Đa ngữ (`VI`, `VI_EN`, `VI_DE`, `VI_EN_DE`)**.
          files: build-output/AnhsTeam_MeetingMinutes.apk
          draft: false
          prerelease: false
