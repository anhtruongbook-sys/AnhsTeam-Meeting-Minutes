name: Build Anh's TEAM Meeting Minutes (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/AnhsTeam_MeetingMinutes.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/AnhsTeam_MeetingMinutes.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnhsTeam_MeetingMinutes-mobile-release-apk
          path: build-output/AnhsTeam_MeetingMinutes.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.0
          name: "Anh's TEAM - Tự Động Gỡ Băng File Ghi Âm Có Sẵn & Sinh Biên Bản Họp (.DOCX) v1.3.0 (Android APK)"
          body: |
            ## Ứng Dụng Ghi Âm Phòng Họp & Tự Động Gỡ Băng File Có Sẵn Thành Biên Bản Cuộc Họp (.DOCX) - Anh's TEAM (v1.3.0)
            - **Tự Động Xử Lý File Ghi Âm Có Sẵn (`AutoAudioMinutesProcessor`) - Không Cần Gõ Tay**:
              + Bấm chọn file ghi âm có sẵn trên máy (`.m4a`, `.wav`, `.mp3`, `.aac`, `.ogg`, `.flac`) hoặc bấm **"Tự Sinh Biên Bản"** ngay trên danh sách file ghi âm sẵn có trong máy.
              + Hệ thống tự động giải mã phần cứng (`MediaExtractor` + `MediaCodec` -> `16kHz Mono PCM`), tự động cắt các đoạn có giọng nói (`VAD Chunker`), tự động nạp luồng âm thanh vào bộ Nhận diện Giọng nói Android (`SpeechRecognizer` qua `EXTRA_AUDIO_SOURCE` pipe / Acoustic Loopback), tự động điền toàn bộ Lượt phát biểu kèm mốc thời gian `[MM:SS]`, tự động rút trích Kết luận & Bảng phân công nhiệm vụ, và **TỰ ĐỘNG XUẤT NGAY FILE WORD (`.DOCX`)** chuẩn Nghị định 30/2020/NĐ-CP mà người dùng không cần nhập thêm bất kỳ chữ nào.
            - **Hỗ trợ 3 Ngôn ngữ (`vi-VN`, `en-US`, `de-DE`) & Xuất Biên bản Đa ngữ (`VI`, `VI_EN`, `VI_DE`, `VI_EN_DE`)**.
          files: build-output/AnhsTeam_MeetingMinutes.apk
          draft: false
          prerelease: false
